# Render.com deployment configuration for combined frontend/backend
version: "1"

services:
  # Combined web service that serves both API and static frontend
  - type: web
    name: rehearsal-scheduler-combined
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: CACHE_VERSION
        value: "v3.0"
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PORT
        value: "10000"

# Note: This configuration combines both frontend and backend into a single service
# The backend serves the frontend static files and handles API requests
# Frontend is built during the build process and served from the backend's dist directory